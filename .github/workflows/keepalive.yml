name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days without
# activity. With a private store the scrape runs commit nothing here, so twice a month
# this calls PUT /repos/{owner}/{repo}/actions/workflows/{workflow_id}/enable for every
# scheduled workflow, itself included. No commits. A failed call turns the run red;
# a disabled workflow can be re-enabled in the Actions tab.

on:
  schedule:
    - cron: "17 4 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  enable:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in scrape.yml scrape-localized.yml export.yml keepalive.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$wf/enable" --silent
            echo "enabled $wf"
          done
