name: Weekly export

# Builds CSV/JSON exports from the data branch and attaches them to a dated release
# (data-YYYY-Www). Exports are never committed.
#
# Releases of a public repository are public, so this runs only in public-branch mode
# (PUBLIC_DATA_BRANCH=true and no DATA_REPO). A private dataset is never published here.

on:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # create releases

concurrency:
  group: export
  cancel-in-progress: true

jobs:
  export:
    if: vars.PUBLIC_DATA_BRANCH == 'true' && vars.DATA_REPO == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Fetch data branch
        run: |
          git fetch --depth=1 origin data:refs/remotes/origin/data
          git worktree add data-branch origin/data
      - name: Export and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%G-W%V)"
          mkdir -p dist
          for dir in data-branch/*/; do
            inst="$(basename "$dir")"
            python -m media_embed_tracer export --data-dir "$dir" --out "export/$inst"
            (cd export && zip -qr "../dist/$inst.zip" "$inst")
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --target "${{ github.sha }}" \
              --title "Data export $tag" --notes "CSV/JSON export of the data branch (UTC)."
          fi
